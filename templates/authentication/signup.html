{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">  
</head>
<body>

    <div class="container">
        <h2>Register</h2>
        <form action="#" method="post">
        {% csrf_token %}

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" placeholder="Enter your Address" required></textarea>

            <button type="submit" class="btn">Register</button>
        </form>
    </div>
    {% if messages %}
        <ul id="message-list" style="display: none;">
            {% for message in messages %}
                <li class="message {{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

</body>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let messageList = document.querySelectorAll("#message-list li");

            messageList.forEach((msg) => {
                alert(msg.textContent);  // ✅ Show alert for each message
            });
        });
    </script>
</html>
