{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login page</title>
  <link rel="stylesheet" href="{% static 'css/signin.css' %}">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <div class="loginbox">
    <form action="" method="post">
      {% csrf_token %}

      <h1>Login</h1>
      <div class="input-box">
        <input type="text" name="username" placeholder="Username" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt' ></i>
      </div>
      <div class="remember-forgot">
        <label><input type="checkbox">Remember Me</label>
        <a href="{% url 'signup' %}">Forgot Password?</a>
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="register-link">
        <p>Dont have an account? <a href="/signup/">Register!</a></p>
      </div>
    </form>
  </div>
    {% if messages %}
    <ul id="message-list" style="display: none;">
        {% for message in messages %}
            <li class="message {{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
  {% endif %}

</body>
  <script>
      document.addEventListener("DOMContentLoaded", function() {
          let messageList = document.querySelectorAll("#message-list li");

          messageList.forEach((msg) => {
              alert(msg.textContent);  // ✅ Show alert for each message
          });
      });
  </script>
</html>
